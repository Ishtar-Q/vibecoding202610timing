<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛糖果風碼錶計時器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka / Quicksand for playful cartoon look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 3D 萌系立體糖果按鈕特效 */
    .btn-3d {
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .btn-3d:not(:disabled):hover {
      transform: translateY(-3px) scale(1.02);
    }
    .btn-3d:not(:disabled):active {
      transform: translateY(4px) scale(0.97);
    }
    .btn-3d:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(45%);
      box-shadow: 0 4px 0 #9ca3af !important;
      transform: none !important;
    }

    /* 浮動可愛裝飾動畫 */
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-9px) scale(1.03); }
    }
    @keyframes pulseDial {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
    @keyframes gentleSway {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(4deg) scale(1.04); }
    }
    @keyframes gentleSwayRev {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(-5deg) scale(1.03); }
    }

    .animate-float {
      animation: floatSoft 4s ease-in-out infinite;
    }
    .animate-cloud {
      animation: floatCloud 5s ease-in-out infinite;
    }
    .running-pulse {
      animation: pulseDial 1.2s ease-in-out infinite;
    }
    .flower-sway {
      transform-origin: bottom center;
      animation: gentleSway 3s ease-in-out infinite;
    }
    .flower-sway-rev {
      transform-origin: bottom center;
      animation: gentleSwayRev 3.5s ease-in-out infinite;
    }
    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    .img-bob {
      animation: gentleBob 3.6s ease-in-out infinite;
    }

    /* 滾動條美化 */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(254, 240, 138, 0.3);
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #fbcfe8;
      border-radius: 8px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden relative" style="background: linear-gradient(180deg, #FFF9E6 0%, #FFF5DC 48%, #D4F0FD 48.1%, #C3ECFE 100%);">

  <!-- 頂部與背景裝飾元素 (放大的浮動雲朵、星星、音符、泡泡) -->

    <!-- 左上可愛大雲朵 -->
    <div class="absolute top-5 left-6 sm:left-12 animate-cloud" style="animation-delay: 0.2s;">

        <div class="absolute -top-7 left-12 w-16 h-16 bg-white rounded-full"></div>
        <!-- 雲朵笑臉與可愛腮紅 -->

          <span class="w-2.5 h-1.5 bg-pink-300 rounded-full"></span>
          <span class="text-sm font-bold text-gray-700 tracking-wider">◕‿◕</span>

      </div>
    </div>

    <!-- 右上音符與星星 (放大) -->

      <svg class="w-10 h-10 text-purple-400 fill-current opacity-85 drop-shadow" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="absolute top-12 right-1/4 animate-float" style="animation-delay: 1.5s;">
      <span class="text-4xl text-yellow-400 drop-shadow-md">⭐</span>

    <!-- 中間泡泡 (放大) -->

    <div class="absolute top-1/3 right-10 w-9 h-9 rounded-full bg-pink-200/60 border-2 border-white/90 animate-float" style="animation-delay: 2.1s;"></div>

  <!-- 主要內容區塊 (時鐘盤 + 紀錄板) -->
  <main class="relative z-10 container mx-auto px-4 pt-4 sm:pt-6 flex-1 flex flex-col items-center">
    
    <!-- 頂部雙欄面板 -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 gap-6 items-center justify-center my-auto">
      
      <!-- 左側：彩虹糖果碼錶時鐘面 -->

  <!-- 狀態機與計時邏輯腳本 -->
  <script>
    // --- 可愛音效生成器 (使用 Web Audio API，無需外掛資源) ---
    class CuteSoundPlayer {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playPop(freq = 600, type = 'sine') {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch (e) {
          // 靜音回退
        }
      }
      playLap() {
        this.playPop(850, 'triangle');
      }
      playReset() {
        this.playPop(420, 'sine');
      }
    }
    const soundPlayer = new CuteSoundPlayer();

    // --- 刻度動態繪製 ---
    function renderDialTicks() {
      const dialGroup = document.getElementById('dialTicks');
      let ticksSvg = '';
      for (let i = 0; i < 60; i++) {
        const angle = i * 6; // 360 / 60
        const isMajor = i % 5 === 0;
        const length = isMajor ? 12 : 6;
        const width = isMajor ? 2.5 : 1.2;
        const color = isMajor ? '#78350F' : '#B45309';
        ticksSvg += `<line x1="150" y1="20" x2="150" y2="${20 + length}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" transform="rotate(${angle} 150 150)" />`;
      }
      dialGroup.innerHTML = ticksSvg;
    }
    renderDialTicks();

    // --- 碼錶核心數據與狀態管理 ---
    // 狀態定義: 'INDEX' (首頁初態), 'RUNNING' (計時中), 'PAUSED' (已暫停)
    let currentState = 'INDEX';
    let startTime = 0;
    let accumulatedTime = 0;
    let timerInterval = null;
    let laps = [];

    // DOM 元素引用
    const displayMinutesHours = document.getElementById('displayMinutesHours');
    const displaySeconds = document.getElementById('displaySeconds');
    const displayMilliseconds = document.getElementById('displayMilliseconds');
    const secondHand = document.getElementById('secondHand');
    const clockContainer = document.getElementById('clockContainer');

    const btnMainToggle = document.getElementById('btnMainToggle');
    const mainBtnText = document.getElementById('mainBtnText');
    const mainBtnIcon = document.getElementById('mainBtnIcon');
    const mainBtnSubIcon = document.getElementById('mainBtnSubIcon');

    const btnReset = document.getElementById('btnReset');
    const btnLap = document.getElementById('btnLap');
    const lapList = document.getElementById('lapList');
    const emptyLapPlaceholder = document.getElementById('emptyLapPlaceholder');

    // 可愛動物徽章列表 (輪播顯示在 LAP 上)
    const LAP_BADGES = [
      { icon: '🐻', label: '熊熊徽章', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      { icon: '🐰', label: '兔兔勳章', color: 'bg-pink-100 text-pink-700 border-pink-300' },
      { icon: '🐥', label: '小雞獎牌', color: 'bg-yellow-100 text-yellow-800 border-yellow-300' },
      { icon: '🐱', label: '貓咪金牌', color: 'bg-purple-100 text-purple-700 border-purple-300' }
    ];

    // 時間格式化工具
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const centiseconds = Math.floor((ms % 1000) / 10);

      const pad = (n) => String(n).padStart(2, '0');
      
      return {
        hoursStr: pad(hours),
        minutesStr: pad(minutes),
        secondsStr: pad(seconds),
        centiStr: pad(centiseconds),
        fullStr: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(centiseconds)}`
      };
    }

    // 更新畫面時鐘文字與秒針
    function updateDisplay(ms) {
      const formatted = formatTime(ms);
      
      // 若超過一小時則顯示 HH:MM，否則顯示 MM:SS 格式更清晰
      if (parseInt(formatted.hoursStr) > 0) {
        displayMinutesHours.textContent = `${formatted.hoursStr}:${formatted.minutesStr}`;
      } else {
        displayMinutesHours.textContent = `00:${formatted.minutesStr}`;
      }

      displaySeconds.textContent = formatted.secondsStr;
      displayMilliseconds.textContent = formatted.centiStr;

      // 旋轉指針角度 (一圈 60 秒)
      const currentSeconds = (ms % 60000) / 1000;
      const angle = currentSeconds * 6; // 360 度 / 60 秒
      secondHand.style.transform = `rotate(${angle}deg)`;
    }

    // --- 按鈕外觀與狀態機轉移 ---
    function updateUIState() {
      switch (currentState) {
        case 'INDEX':
          // 初始狀態：顯示綠色 START 按鈕，RESET 與 LAP 皆 disabled
          setMainBtnStyle('START');
          btnReset.disabled = true;
          btnLap.disabled = true;
          clockContainer.classList.remove('running-pulse');
          break;

        case 'RUNNING':
          // 計時中：主按鈕動態切換為黃色 PAUSE 香蕉風格，RESET 與 LAP 均 enabled
          setMainBtnStyle('PAUSE');
          btnReset.disabled = false;
          btnLap.disabled = false;
          clockContainer.classList.add('running-pulse');
          break;

        case 'PAUSED':
          // 暫停狀態：主按鈕動態切換為 CONTINUE 繼續，RESET 可用，LAP 暫停
          setMainBtnStyle('CONTINUE');
          btnReset.disabled = false;
          btnLap.disabled = true;
          clockContainer.classList.remove('running-pulse');
          break;
      }
    }

    // 設置單一合併主按鈕樣式 (START / PAUSE / CONTINUE)
    function setMainBtnStyle(type) {
      btnMainToggle.className = "btn-3d w-full flex items-center justify-center space-x-2 py-3 px-6 rounded-3xl font-extrabold text-lg sm:text-xl tracking-wide border-2 transition-all duration-200 ";
      
      if (type === 'START') {
        btnMainToggle.classList.add(
          'text-white',
          'bg-gradient-to-b', 'from-[#A5E358]', 'to-[#7BCB2F]',
          'border-[#549E1F]', 'shadow-[0_6px_0_#488523]'
        );
        mainBtnText.textContent = 'START';
        mainBtnIcon.innerHTML = `<svg class="w-7 h-7 fill-amber-200 text-yellow-500 drop-shadow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`;
        mainBtnSubIcon.textContent = '🐾';
      } else if (type === 'PAUSE') {
        btnMainToggle.classList.add(
          '!text-[#7C4A03]',
          'bg-gradient-to-b', 'from-[#FFE358]', 'to-[#F7C61E]',
          'border-[#D99B08]', 'shadow-[0_6px_0_#C58F10]'
        );
        mainBtnText.textContent = 'PAUSE';
        mainBtnIcon.innerHTML = `<span class="text-2xl">🍌</span>`;
        mainBtnSubIcon.textContent = '💤';
      } else if (type === 'CONTINUE') {
        btnMainToggle.classList.add(
          'text-white',
          'bg-gradient-to-b', 'from-[#FFA726]', 'to-[#FB8C00]',
          'border-[#E65100]', 'shadow-[0_6px_0_#C2410C]'
        );
        mainBtnText.textContent = 'CONTINUE';
        mainBtnIcon.innerHTML = `<svg class="w-6 h-6 fill-white text-white drop-shadow" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>`;
        mainBtnSubIcon.textContent = '☀️';
      }
    }

    // --- 動作處理邏輯 ---

    // 1. 開始計時
    function handleStart() {
      soundPlayer.playPop(550);
      startTime = performance.now();
      timerInterval = requestAnimationFrame(tick);
      currentState = 'RUNNING';
      updateUIState();
    }

    // 動畫幀循環計時
    function tick() {
      if (currentState !== 'RUNNING') return;
      const now = performance.now();
      const currentElapsed = accumulatedTime + (now - startTime);
      updateDisplay(currentElapsed);
      timerInterval = requestAnimationFrame(tick);
    }

    // 2. 暫停計時
    function handlePause() {
      if (currentState !== 'RUNNING') return;
      soundPlayer.playPop(480);
      cancelAnimationFrame(timerInterval);
      accumulatedTime += performance.now() - startTime;
      currentState = 'PAUSED';
      updateDisplay(accumulatedTime);
      updateUIState();
    }

    // 3. 繼續計時
    function handleContinue() {
      handleStart();
    }

    // 4. 重設計時器 (回到 Index 首頁狀態)
    function handleReset() {
      soundPlayer.playReset();
      cancelAnimationFrame(timerInterval);
      currentState = 'INDEX';
      accumulatedTime = 0;
      startTime = 0;
      laps = [];
      updateDisplay(0);
      renderLaps();
      updateUIState();
    }

    // 5. 記憶時間 (LAP)
    function handleLap() {
      if (currentState === 'INDEX') return;
      soundPlayer.playLap();
      
      const currentElapsed = currentState === 'RUNNING' 
        ? accumulatedTime + (performance.now() - startTime) 
        : accumulatedTime;

      const lapNumber = laps.length + 1;
      const formatted = formatTime(currentElapsed);
      const badge = LAP_BADGES[(lapNumber - 1) % LAP_BADGES.length];

      laps.unshift({
        id: lapNumber,
        formattedTime: formatted.fullStr,
        badge: badge
      });

      renderLaps();
    }

    // 渲染圈數記錄板
    function renderLaps() {
      if (laps.length === 0) {
        lapList.innerHTML = '';
        lapList.appendChild(emptyLapPlaceholder);
        return;
      }

      lapList.innerHTML = '';
      laps.forEach((lap, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 rounded-xl border bg-white/90 shadow-sm transform transition hover:scale-[1.01] border-amber-200/70';
        
        // 顏色區分前幾名
        const lapColor = idx === 0 ? 'text-[#F57C00]' : (idx === 1 ? 'text-[#0284C7]' : 'text-gray-700');
        
        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-6 h-6 rounded-full border flex items-center justify-center text-xs ${lap.badge.color}">
              ${lap.badge.icon}
            </span>
            <span class="font-extrabold text-xs tracking-wider ${lapColor}">
              LAP ${String(lap.id).padStart(2, '0')}
            </span>
          </div>
          <div class="font-mono font-bold text-sm tracking-tight text-gray-800">
            ${lap.formattedTime}
          </div>
        `;
        lapList.appendChild(item);
      });
    }

    // --- 事件綁定 ---

    // 合併後的動態主按鈕 (點擊切換 START -> PAUSE -> CONTINUE -> PAUSE...)
    btnMainToggle.addEventListener('click', () => {
      if (currentState === 'INDEX') {
        handleStart();
      } else if (currentState === 'RUNNING') {
        handlePause();
      } else if (currentState === 'PAUSED') {
        handleContinue();
      }
    });

    // RESET 按鈕
    btnReset.addEventListener('click', () => {
      handleReset();
    });

    // LAP 按鈕
    btnLap.addEventListener('click', () => {
      handleLap();
    });

    // 鍵盤無障礙支援 (空白鍵開始/暫停、L鍵計圈、R鍵重設)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        btnMainToggle.click();
      } else if (e.code === 'KeyL' && !btnLap.disabled) {
        handleLap();
      } else if (e.code === 'KeyR' && !btnReset.disabled) {
        handleReset();
      }
    });

    // 初始化狀態
    updateUIState();
  </script>
</body>
</html>
